<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SEVOYAN Luxury</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        SEVOYAN
    </a>

</header>


<section class="collections">

    <!-- LOGIN -->

    <div id="admin-login" class="checkout-box">

        <h2 class="section-title">
            🔐 Admin մուտք
        </h2>

        <form id="login-form">

            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Գաղտնաբառ"
                required
            >

            <button type="submit">
                🔑 Մուտք գործել
            </button>

        </form>

    </div>


    <!-- ADMIN PANEL -->

    <div id="admin-panel" style="display:none;">

        <button id="logout-btn">
            🚪 Դուրս գալ
        </button>


        <!-- PRODUCTS -->

        <div class="checkout-box">

            <h2 class="section-title">
                ➕ Ավելացնել նոր ապրանք
            </h2>

            <form id="product-form">

                <input
                    type="text"
                    id="product-name"
                    placeholder="Ապրանքի անունը"
                    required
                >

                <input
                    type="number"
                    id="product-price"
                    placeholder="Գինը ֏"
                    required
                >

                <input
                    type="text"
                    id="product-image"
                    placeholder="Նկարի հղումը"
                >

                <button type="submit">
                    ➕ Ավելացնել ապրանք
                </button>

            </form>

        </div>


        <h2 class="section-title">
            📦 Ապրանքներ
        </h2>

        <div id="admin-products"></div>


        <!-- COLLECTIONS -->

        <div class="checkout-box">

            <h2 class="section-title">
                ✨ Ավելացնել նոր հավաքածու
            </h2>

            <form id="collection-form">

                <input
                    type="text"
                    id="collection-name"
                    placeholder="Հավաքածուի անունը"
                    required
                >

                <input
                    type="number"
                    id="collection-price"
                    placeholder="Գինը ֏"
                    required
                >

                <textarea
                    id="collection-images"
                    placeholder="Նկարների հղումները։ Յուրաքանչյուր նկարը գրիր նոր տողում։

Օրինակ՝
https://example.com/image1.jpg
https://example.com/image2.jpg
https://example.com/image3.jpg"
                    rows="7"
                    required
                ></textarea>

                <button type="submit">
                    ➕ Ավելացնել հավաքածու
                </button>

            </form>

        </div>


        <h2 class="section-title">
            🖼️ Հավաքածուներ
        </h2>

        <div id="admin-collections"></div>

    </div>

</section>


<footer class="footer">

    <h3>SEVOYAN Luxury</h3>

    <p>Premium Fashion Brand</p>

    <p>
        © 2026 SEVOYAN Luxury. All rights reserved.
    </p>

</footer>


<script src="js/admin.js"></script>

</body>
</html>
