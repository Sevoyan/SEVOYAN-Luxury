<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | SEVOYAN Luxury</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            background: #0b0b0b;
            color: white;
        }

        .admin-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            padding: 20px;
        }

        .admin-box {
            background: #111;
            border: 1px solid #D4AF37;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .admin-box h1,
        .admin-box h2 {
            text-align: center;
            color: #D4AF37;
            margin-bottom: 25px;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-form input,
        .admin-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background: #181818;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-form textarea {
            min-height: 160px;
            resize: vertical;
        }

        .admin-btn {
            padding: 15px;
            background: #D4AF37;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #logout-btn {
            display: block;
            margin: 0 auto 25px;
            padding: 10px 25px;
            background: #222;
            color: #D4AF37;
            border: 1px solid #D4AF37;
            border-radius: 8px;
            cursor: pointer;
        }

        #admin-products {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
        }

        .admin-product-image {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        .admin-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-product-info h3 {
            margin: 0 0 8px;
            color: white;
        }

        .admin-product-info p {
            margin: 5px 0;
            color: #D4AF37;
            font-weight: bold;
        }

        .admin-product-info small {
            color: #aaa;
        }

        .admin-product-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .edit-product,
        .delete-product {
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-product {
            background: #D4AF37;
            color: #111;
        }

        .delete-product {
            background: #8b0000;
            color: white;
        }

        .featured-check {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #181818;
            border: 1px solid #444;
            border-radius: 8px;
        }

        .featured-check input {
            width: 20px;
            height: 20px;
        }

        .featured-check span {
            color: #D4AF37;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .admin-container {
                margin-top: 90px;
                padding: 10px;
            }

            .admin-box {
                padding: 20px 15px;
            }

            .admin-product {
                flex-direction: column;
                text-align: center;
            }

            .admin-product-buttons {
                width: 100%;
            }

            .edit-product,
            .delete-product {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="index.html"
        class="logo"
    >
        SEVOYAN
    </a>

</header>


<main class="admin-container">


    <!-- LOGIN -->

    <div
        id="admin-login"
        class="admin-box"
    >

        <h1>
            🔐 Admin մուտք
        </h1>


        <form
            id="login-form"
            class="admin-form"
        >

            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="admin-password"
                placeholder="Գաղտնաբառ"
                required
            >


            <button
                type="submit"
                class="admin-btn"
            >
                🔑 Մուտք գործել
            </button>

        </form>

    </div>



    <!-- ADMIN -->

    <div
        id="admin-panel"
        class="admin-box"
        style="display:none;"
    >

        <h1>
            ⚙️ Ապրանքների կառավարում
        </h1>


        <button
            id="logout-btn"
            type="button"
        >
            🚪 Դուրս գալ
        </button>



        <!-- ADD PRODUCT -->

        <div class="admin-box">

            <h2>
                ➕ Ավելացնել ապրանք
            </h2>


            <form
                id="product-form"
                class="admin-form"
            >


                <input
                    type="text"
                    id="product-name"
                    placeholder="🇦🇲 Ապրանքի անունը"
                    required
                >


                <input
                    type="text"
                    id="product-name-en"
                    placeholder="🇬🇧 Product name"
                    required
                >


                <input
                    type="text"
                    id="product-name-ru"
                    placeholder="🇷🇺 Название товара"
                    required
                >


                <input
                    type="number"
                    id="product-price"
                    placeholder="Գինը ֏"
                    min="1"
                    required
                >


                <textarea
                    id="product-image"
                    placeholder="Նկարների հղումները։ Յուրաքանչյուր նկարը գրիր նոր տողում։"
                    required
                ></textarea>


                <label class="featured-check">

                    <input
                        type="checkbox"
                        id="product-featured"
                    >

                    <span>
                        ⭐ Ցուցադրել գլխավոր էջում
                    </span>

                </label>


                <button
                    type="submit"
                    class="admin-btn"
                >
                    ➕ Ավելացնել ապրանք
                </button>

            </form>

        </div>



        <!-- PRODUCTS -->

        <div class="admin-box">

            <h2>
                📦 Բոլոր ապրանքները
            </h2>


            <div id="admin-products">

                Ապրանքները բեռնվում են...

            </div>

        </div>

    </div>

</main>



<footer class="footer">

    <h3>
        SEVOYAN Luxury
    </h3>

    <p>
        Premium Fashion Brand
    </p>

    <p>
        © 2026 SEVOYAN Luxury.
        All rights reserved.
    </p>

</footer>


<script src="js/admin.js?v=40"></script>

</body>

</html>
