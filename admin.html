<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SEVOYAN Luxury</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-container {
            max-width: 1100px;
            margin: 140px auto 60px;
            padding: 20px;
        }

        .admin-box {
            background: #111;
            border: 1px solid #D4AF37;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .admin-box h1,
        .admin-box h2 {
            color: #D4AF37;
            text-align: center;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-form input,
        .admin-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: #181818;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-form textarea {
            min-height: 130px;
            resize: vertical;
        }

        .admin-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #D4AF37;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .admin-btn:hover {
            opacity: 0.85;
        }

        .logout-btn {
            background: #8b0000;
            color: white;
            margin-bottom: 20px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #181818;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .admin-product img {
            width: 110px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #D4AF37;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-product-info h3 {
            color: white;
            margin: 0 0 8px;
        }

        .admin-product-info p {
            color: #D4AF37;
            margin: 5px 0;
        }

        .admin-product-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn {
            background: #D4AF37;
            color: black;
        }

        .delete-btn {
            background: #900;
            color: white;
        }

        .hidden {
            display: none;
        }

        .image-help {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .admin-product {
                flex-direction: column;
                align-items: stretch;
            }

            .admin-product img {
                width: 100%;
                height: 220px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">SEVOYAN</a>
</header>


<div class="admin-container">

    <!-- LOGIN -->

    <div id="admin-login" class="admin-box">

        <h1>🔐 Admin մուտք</h1>

        <form id="login-form" class="admin-form">

            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Գաղտնաբառ"
                required
            >

            <button type="submit" class="admin-btn">
                🔑 Մուտք գործել
            </button>

        </form>

    </div>


    <!-- ADMIN PANEL -->

    <div id="admin-panel" class="hidden">

        <div class="admin-box">

            <h1>⚙️ SEVOYAN Admin</h1>

            <button id="logout-btn" class="admin-btn logout-btn">
                🚪 Դուրս գալ
            </button>

            <h2>➕ Նոր ապրանք</h2>

            <form id="product-form" class="admin-form">

                <input
                    type="text"
                    id="product-name"
                    placeholder="Ապրանքի անունը"
                    required
                >

                <input
                    type="number"
                    id="product-price"
                    placeholder="Գինը ֏"
                    required
                >

                <textarea
                    id="product-images"
                    placeholder="Նկարների հղումները՝ ամեն մեկը նոր տողում"
                    required
                ></textarea>

                <div class="image-help">
                    🖼️ Կարող ես գրել 1, 2, 3 կամ ավելի նկարների հղումներ։<br>
                    Ամեն նկարը գրիր առանձին տողով։
                </div>

                <button type="submit" class="admin-btn">
                    ➕ Ավելացնել ապրանք
                </button>

            </form>

        </div>


        <div class="admin-box">

            <h2>🛍️ Բոլոր ապրանքները</h2>

            <div id="admin-products">
                Բեռնում...
            </div>

        </div>

    </div>

</div>


<script src="js/admin.js"></script>

</body>
</html>
