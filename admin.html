<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | SEVOYAN</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">SEVOYAN</a>
</header>

<div class="admin-container">

    <!-- LOGIN -->
    <div id="admin-login">

        <h1>🔐 Admin մուտք</h1>

        <form id="login-form">

            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Գաղտնաբառ"
                required
            >

            <button type="submit">
                🔑 Մուտք գործել
            </button>

        </form>

    </div>


    <!-- ADMIN PANEL -->
    <div id="admin-panel" style="display:none;">

        <h1>⚙️ Ապրանքների կառավարում</h1>

        <button id="logout-btn">
            🚪 Դուրս գալ
        </button>

        <form id="product-form">

            <input
                type="text"
                id="product-name"
                placeholder="Ապրանքի անունը"
                required
            >

            <input
                type="number"
                id="product-price"
                placeholder="Գինը"
                required
            >

            <input
                type="text"
                id="product-image"
                placeholder="Նկարի հղումը"
            >

            <button type="submit">
                ➕ Ավելացնել ապրանք
            </button>

        </form>

        <div id="admin-products"></div>

    </div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
