<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | SEVOYAN Luxury</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        .admin-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            padding: 20px;
        }

        .admin-box {
            background: #111;
            border: 1px solid #D4AF37;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .admin-box h1,
        .admin-box h2 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-form input,
        .admin-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background: #181818;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .admin-form input:focus,
        .admin-form textarea:focus {
            outline: none;
            border-color: #D4AF37;
        }

        .admin-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #D4AF37;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-btn:hover {
            opacity: 0.85;
        }

        #logout-btn {
            display: block;
            margin: 0 auto 25px;
            padding: 10px 20px;
            background: #222;
            color: #D4AF37;
            border: 1px solid #D4AF37;
            border-radius: 8px;
            cursor: pointer;
        }

        #admin-products {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
        }

        .admin-product-image {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .admin-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-product-info h3 {
            margin: 0 0 8px;
            color: white;
        }

        .admin-product-info p {
            margin: 5px 0;
            color: #D4AF37;
            font-weight: bold;
        }

        .admin-product-info small {
            color: #aaa;
        }

        .admin-product-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .edit-product,
        .delete-product {
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-product {
            background: #D4AF37;
            color: #111;
            border: none;
        }

        .delete-product {
            background: #8b0000;
            color: white;
            border: none;
        }

        .loading {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .admin-container {
                margin-top: 90px;
                padding: 10px;
            }

            .admin-box {
                padding: 20px 15px;
            }

            .admin-product {
                flex-direction: column;
                text-align: center;
            }

            .admin-product-buttons {
                width: 100%;
            }

            .edit-product,
            .delete-product {
                width: 100%;
            }
        }
    </style>
</head>


<body>

    <!-- HEADER -->
    <header class="header">

        <a
            href="index.html"
            class="logo"
        >
            SEVOYAN
        </a>

        <nav>

            <a href="index.html">
                🏠 Գլխավոր
            </a>

            <a href="shop.html">
                🛍 Խանութ
            </a>

            <a href="favorites.html">
                ❤️ Սիրելիներ
            </a>

            <a href="cart.html">
                🛒 Զամբյուղ
            </a>

            <a href="about.html">
                💎 Մեր մասին
            </a>

            <a href="contact.html">
                📞 Կապ
            </a>

        </nav>

    </header>


    <!-- ADMIN -->
    <main class="admin-container">


        <!-- LOGIN -->
        <div
            id="admin-login"
            class="admin-box"
        >

            <h1>
                🔐 Admin մուտք
            </h1>

            <form
                id="login-form"
                class="admin-form"
            >

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Գաղտնաբառ"
                    required
                >

                <button
                    type="submit"
                    class="admin-btn"
                >
                    🔑 Մուտք գործել
                </button>

            </form>

        </div>


        <!-- ADMIN PANEL -->
        <div
            id="admin-panel"
            class="admin-box"
            style="display: none;"
        >

            <h1>
                ⚙️ Ապրանքների կառավարում
            </h1>


            <!-- LOGOUT -->
            <button
                id="logout-btn"
                type="button"
            >
                🚪 Դուրս գալ
            </button>


            <!-- ADD PRODUCT -->
            <div class="admin-box">

                <h2>
                    ✨ Ավելացնել նոր ապրանք
                </h2>

                <form
                    id="product-form"
                    class="admin-form"
                >

                    <input
                        type="text"
                        id="product-name"
                        placeholder="Ապրանքի անունը"
                        required
                    >


                    <input
                        type="number"
                        id="product-price"
                        placeholder="Գինը ֏"
                        min="1"
                        required
                    >


                    <textarea
                        id="product-image"
                        placeholder="Նկարների հղումները։ Մեկը յուրաքանչյուր տողում։

Օրինակ՝
https://example.com/image1.jpg
https://example.com/image2.jpg
https://example.com/image3.jpg"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="admin-btn"
                    >
                        ➕ Ավելացնել ապրանք
                    </button>

                </form>

            </div>


            <!-- PRODUCTS -->
            <div class="admin-box">

                <h2>
                    📦 Ապրանքներ
                </h2>

                <div id="admin-products">

                    <div class="loading">
                        Ապրանքները բեռնվում են...
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <h3>
            SEVOYAN Luxury
        </h3>

        <p>
            Premium Fashion Brand
        </p>

        <p>
            © 2026 SEVOYAN Luxury.
            All rights reserved.
        </p>

    </footer>


    <!-- ADMIN JS -->
    <script src="js/admin.js"></script>

</body>

</html>
