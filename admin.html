<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SEVOYAN</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        SEVOYAN
    </a>

</header>


<div class="admin-container">

    <!-- LOGIN -->

    <div id="admin-login">

        <h1>🔐 Admin մուտք</h1>

        <form id="login-form">

            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Գաղտնաբառ"
                required
            >

            <button type="submit">
                🔑 Մուտք գործել
            </button>

        </form>

    </div>


    <!-- ADMIN PANEL -->

    <div
        id="admin-panel"
        style="display:none;"
    >

        <h1>⚙️ Ապրանքների կառավարում</h1>

        <button id="logout-btn">
            🚪 Դուրս գալ
        </button>


        <form id="product-form">

            <input
                type="text"
                id="product-name"
                placeholder="Ապրանքի անունը"
                required
            >

            <input
                type="number"
                id="product-price"
                placeholder="Գինը"
                required
            >


            <label>
                📸 Նկարների հղումներ
            </label>

            <p>
                Ամեն նկարի հղումը գրիր նոր տողում։
            </p>

            <textarea
                id="product-image"
                placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg&#10;https://example.com/image3.jpg"
                rows="6"
            ></textarea>


            <button type="submit">
                ➕ Ավելացնել ապրանք
            </button>

        </form>


        <div id="admin-products"></div>

    </div>

</div>


<script src="js/admin.js?v=20"></script>

</body>

</html>
