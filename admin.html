<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SEVOYAN Luxury</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            max-width: 900px;
            margin: 120px auto 50px;
            padding: 20px;
        }

        .admin-title {
            text-align: center;
            color: #D4AF37;
            margin-bottom: 30px;
        }

        .admin-form {
            background: #181818;
            padding: 30px;
            border: 1px solid #D4AF37;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-form input {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
        }

        .admin-form button {
            padding: 15px;
            background: #D4AF37;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        #admin-products {
            margin-top: 40px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #181818;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .admin-product img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        .admin-product button {
            margin-left: auto;
            padding: 10px 15px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">SEVOYAN</a>
</header>

<div class="admin-container">

    <h1 class="admin-title">⚙️ Ապրանքների կառավարում</h1>

    <form id="product-form" class="admin-form">

        <input
            type="text"
            id="product-name"
            placeholder="Ապրանքի անունը"
            required>

        <input
            type="number"
            id="product-price"
            placeholder="Գինը"
            required>

        <input
            type="text"
            id="product-image"
            placeholder="Նկարի հղումը">

        <button type="submit">
            ➕ Ավելացնել ապրանք
        </button>

    </form>

    <div id="admin-products"></div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
