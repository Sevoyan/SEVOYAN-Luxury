<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SEVOYAN</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">SEVOYAN</a>
    </header>


    <div class="admin-container">

        <h1>⚙️ Ապրանքների կառավարում</h1>


        <!-- ԱՊՐԱՆՔ ԱՎԵԼԱՑՆԵԼ -->

        <form id="product-form">

            <input
                type="text"
                id="product-name"
                placeholder="Ապրանքի անունը"
                required
            >

            <input
                type="number"
                id="product-price"
                placeholder="Գինը"
                required
            >

            <input
                type="text"
                id="product-image"
                placeholder="Նկարի հղումը"
            >

            <button type="submit">
                ➕ Ավելացնել ապրանք
            </button>

        </form>


        <!-- ԱՊՐԱՆՔՆԵՐԻ ՑԱՆԿ -->

        <div id="admin-products"></div>

    </div>


    <!-- ADMIN JAVASCRIPT -->

    <script src="js/admin.js"></script>

</body>

</html>
