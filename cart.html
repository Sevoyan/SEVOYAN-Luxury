<!DOCTYPE html>
<html lang="hy">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Զամբյուղ | SEVOYAN Luxury</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        .cart-section {
            min-height: 75vh;
            padding: 60px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .cart-title {
            text-align: center;
            color: #d4af37;
            font-family: Cinzel, serif;
            font-size: 38px;
            margin-bottom: 40px;
        }

        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 25px;
            border: 1px solid #d4af37;
            border-radius: 15px;
            background: rgba(255,255,255,0.04);
        }

        .cart-item-info h3 {
            color: white;
            margin: 0 0 10px;
            font-size: 22px;
        }

        .cart-item-info p {
            color: #d4af37;
            margin: 5px 0;
            font-size: 18px;
        }

        .remove-btn {
            border: none;
            background: #d4af37;
            color: #111;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-total {
            text-align: right;
            color: #d4af37;
            font-size: 25px;
            margin-top: 30px;
            font-weight: 600;
        }

        .checkout-btn {
            display: block;
            width: fit-content;
            margin: 25px 0 0 auto;
            padding: 14px 25px;
            background: #d4af37;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .empty-cart {
            text-align: center;
            color: white;
            font-size: 24px;
            padding: 50px;
        }

        .language-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .language-switcher button {
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .remove-btn {
                width: 100%;
            }

            .cart-title {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>


<header class="header">

    <a
        href="index.html"
        class="logo"
    >
        SEVOYAN
    </a>


    <nav>

        <a
            href="index.html"
            data-i18n="home"
        >
            🏠 Գլխավոր
        </a>

        <a
            href="shop.html"
            data-i18n="shop"
        >
            🛍 Խանութ
        </a>

        <a
            href="favorites.html"
            data-i18n="favorites"
        >
            ❤️ Սիրելիներ
        </a>

        <a href="cart.html">

            🛒

            <span data-i18n="cart">
                Զամբյուղ
            </span>

            <span id="cart-count">
                0
            </span>

        </a>

        <a
            href="about.html"
            data-i18n="about"
        >
            💎 Մեր մասին
        </a>

        <a
            href="contact.html"
            data-i18n="contact"
        >
            📞 Կապ
        </a>

        <a
            href="login.html"
            data-i18n="login"
        >
            👤 Մուտք
        </a>

    </nav>


    <div class="language-switcher">

        <button
            id="lang-hy"
            type="button"
            onclick="changeLanguage('hy')"
        >
            🇦🇲 HY
        </button>

        <button
            id="lang-en"
            type="button"
            onclick="changeLanguage('en')"
        >
            🇬🇧 EN
        </button>

        <button
            id="lang-ru"
            type="button"
            onclick="changeLanguage('ru')"
        >
            🇷🇺 RU
        </button>

    </div>

</header>


<section class="cart-section">

    <h2
        class="cart-title"
        data-i18n="yourCart"
    >
        🛒 Ձեր զամբյուղը
    </h2>


    <div id="cart-items"></div>

</section>


<footer class="footer">

    <h3>
        SEVOYAN Luxury
    </h3>

    <p data-i18n="premiumBrand">
        Premium Fashion Brand
    </p>

    <p>

        © 2026 SEVOYAN Luxury.

        <span data-i18n="allRights">
            All rights reserved.
        </span>

    </p>

</footer>


<script src="js/language.js?v=30"></script>

<script src="js/cart.js?v=30"></script>


</body>

</html>
