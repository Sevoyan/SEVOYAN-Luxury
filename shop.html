<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Խանութ | SEVOYAN Luxury</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">SEVOYAN</a>

    <nav>
        <a href="index.html">🏠 Գլխավոր</a>
        <a href="shop.html">🛍 Խանութ</a>
        <a href="favorites.html">❤️ Սիրելիներ</a>
        <a href="cart.html">🛒 Զամբյուղ</a>
        <a href="about.html">ℹ️ Մեր մասին</a>
        <a href="contact.html">📞 Կապ</a>
    </nav>

</header>


<section class="featured">

    <h2>Մեր ապրանքները</h2>

    <div class="products" id="products"></div>

</section>


<script src="js/products.js"></script>

<script>
    const container = document.getElementById("products");

    products.forEach(product => {

        container.innerHTML += `
            <div class="product-card">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>${product.name}</h3>

                <p>${product.price} ֏</p>

                <button onclick="addToCart('${product.name}', ${product.price}, '${product.image}')">
                    🛒 Ավելացնել զամբյուղ
                </button>

            </div>
        `;

    });
</script>

<script src="js/cart.js"></script>

</body>
</html>
